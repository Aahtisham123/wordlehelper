name: Daily Wordle answers

# Fetches the latest Wordle answers into data/daily.json and commits them.
# Hosts connected to this repo (Vercel, Netlify, Cloudflare Pages) rebuild on
# that push. For other hosts, add a DEPLOY_HOOK_URL repository secret.

on:
  schedule:
    # Shortly after midnight UTC, plus retries later in the day.
    - cron: "17 0,3,9,15 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Fetch every past answer since June 2021"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-answers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch answers
        run: node scripts/fetch-daily.mjs ${{ inputs.backfill && '--backfill' || '' }}
      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet data/daily.json; then
            echo "No new answers."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/daily.json
            git commit -m "Update daily Wordle answers"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger deploy hook
        if: steps.commit.outputs.changed == 'true' && env.DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"
